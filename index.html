<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мониторинг сайтов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo"></span>
        <h1>Мониторинг</h1>
      </div>
      <div class="summary" id="summary"></div>
      <div class="actions">
        <button class="btn" id="filterBtn" type="button">Только лежащие</button>
        <button class="btn btn--icon" id="refreshBtn" type="button" aria-label="Обновить" title="Обновить">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </header>

    <div class="meta">
      <span id="updatedAt">Загрузка…</span>
      <span class="badge" id="demoBadge" hidden>демо-данные</span>
    </div>

    <ul class="list" id="list">
      <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
      <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
    </ul>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <button class="modal__close" type="button" data-close aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>

      <div class="modal__head">
        <span class="dot" id="mDot"></span>
        <div class="modal__titles">
          <h2 id="mTitle"></h2>
          <a id="mUrl" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><span class="stat__label">Аптайм за 24 ч</span><span class="stat__value" id="mUptime">—</span></div>
        <div class="stat"><span class="stat__label">Среднее время</span><span class="stat__value" id="mAvg">—</span></div>
        <div class="stat"><span class="stat__label">Падений</span><span class="stat__value" id="mIncidents">—</span></div>
      </div>

      <div class="chart-head">
        <span>Время ответа, мс</span>
        <span class="legend-down"><i></i>недоступен</span>
      </div>
      <div class="chart" id="chart"></div>

      <div class="strip" id="strip"></div>
      <div class="strip-legend"><span>24 ч назад</span><span>сейчас</span></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
